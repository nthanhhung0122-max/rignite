name: Auto Rignite Mining - Hungzai22 (24/7)

on:
  workflow_dispatch:
  schedule:
    # Tự động kích hoạt lại sau mỗi chu kỳ phòng khi runner hết giờ
    - cron: '*/30 * * * *'

jobs:
  run-mining:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # Chạy tối đa ~6 tiếng mỗi lượt của GitHub Actions

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chạy Bot Auto Rignite (Acc Hungzai22)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          TELEGRAM_STRING_SESSION_ACC1: ${{ secrets.TELEGRAM_STRING_SESSION_ACC1 }}
        run: |
          python auto_rignite_hungzai.py
