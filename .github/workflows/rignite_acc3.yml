name: Auto Rignite - Acc 3 (phanhoang)

on:
  workflow_dispatch:
  schedule:
    - cron: '6 */5 * * *'

concurrency:
  group: rignite-acc3
  cancel-in-progress: false

jobs:
  run-rignite-acc3:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon colorama

      - name: Chay Auto Rignite - Acc 3 (phanhoang)
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
          WORKFLOW_NAME: "rignite_acc3.yml"
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python auto_rignite.py --acc 3

      - name: Tu dong ban giao ca tiep theo (Handover Chaining 24/7)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Kich hoat ca chay tiep theo cho Acc 3..."
          sleep 10
          gh workflow run rignite_acc3.yml --repo "${{ github.repository }}" || curl -s -X POST -H "Authorization: Bearer ${{ secrets.GH_PAT }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/actions/workflows/rignite_acc3.yml/dispatches -d '{"ref":"main"}' || echo "Handover triggered."
